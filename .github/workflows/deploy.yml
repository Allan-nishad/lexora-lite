name: CI & Security Quality Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint, Test, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Clean Dependencies
        run: npm ci

      - name: Run ESLint Quality Check
        run: npm run lint

      - name: Run Strict TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Automated Test Suite (18 Scenarios)
        run: npm test

      - name: Verify Production Next.js Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_ci_test_key' }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
        run: npm run build
